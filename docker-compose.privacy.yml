services:
  tomatoruler-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/privacy/public:/usr/share/nginx/html:ro
      - ./deploy/privacy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default

networks:
  default:
    external: true
    name: dokploy-network
